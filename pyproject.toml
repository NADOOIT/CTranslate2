[build-system]
requires = ["setuptools>=61.0", "cmake>=3.12", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctranslate2"
version = "4.0.0"
description = "Fork of ctranslate2 with Metal support"
authors = [
    { name = "NADOO", email = "info@nadoo.de" }
]
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["ctranslate2", "metal", "gpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
]

[tool.cibuildwheel]
# Build for Python 3.8 to 3.12
build = [
    "cp38-*",
    "cp39-*",
    "cp310-*",
    "cp311-*",
    "cp312-*"
]

# Specify the platforms you want to build for
platforms = [
    "macos-x86_64",
    "macos-arm64"
]

# Specify the path to the Python package
build-dir = "python/dist"

# Optional: Add any additional build settings
# For example, skip builds that would fail
[tool.cibuildwheel.overrides]
filter = [
    "*-win32",
    "*-manylinux_i686"
]

[project.urls]
"Homepage" = "https://github.com/yourusername/ctranslate2-metal"

[tool.setuptools.packages.find]
where = ["src"]
