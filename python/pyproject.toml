[project]
name = "ctranslate2"
version = "4.5.1"
description = "Fast inference engine for OpenNMT models"
authors = [{ name = "OpenNMT", email = "contact@opennmt.net" }]
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "pyyaml<7,>=5.3",
]

[build-system]
requires = ["setuptools>=61.0", "cmake>=3.12", "pybind11>=2.6.0"]
build-backend = "setuptools.build_meta"
